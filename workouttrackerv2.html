<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>60 Day Challenge V2</title>
  <link rel="icon" href="assets/img/favicon-workout.png" type="image/png" />
  <style>
    :root {
      --bg: #0d0a08;
      --surface: #1c1410;
      --surface2: #261a12;
      --border: #3d2a1a;
      --coral: #ff6b47;
      --sunset: #ff9f5a;
      --peach: #ffcba4;
      --cream: #fff0e6;
      --muted: #8a6a55;
      --text: #f5ddd0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    /* NAV */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-brand {
      font-weight: 700;
      font-size: 1rem;
      color: var(--coral);
      letter-spacing: 0.04em;
    }
    .nav-right { display: flex; align-items: center; gap: 0.5rem; }
    #statsBtn {
      background: var(--coral);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.35rem 0.8rem;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    #statsBtn:hover { background: #e55a38; }

    /* HERO */
    .hero {
      text-align: center;
      padding: 2rem 1rem 1rem;
    }
    .hero h1 {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 800;
      color: var(--coral);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .hero p {
      color: var(--sunset);
      font-size: 0.8rem;
      margin-top: 0.25rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* PROGRESS BAR */
    .progress-wrap {
      max-width: 700px;
      margin: 1rem auto;
      padding: 0 1rem;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    .progress-bar-outer {
      background: var(--surface2);
      border-radius: 999px;
      height: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .progress-bar-inner {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--coral), var(--sunset));
      transition: width 0.4s ease;
    }

    /* DAY NAV */
    .day-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1rem;
    }
    .day-nav button {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      width: 36px;
      height: 36px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .day-nav button:hover:not(:disabled) { background: var(--border); }
    .day-nav button:disabled { opacity: 0.3; cursor: default; }
    .day-info { text-align: center; }
    .day-info .day-num {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--coral);
    }
    .day-info .day-date {
      font-size: 0.78rem;
      color: var(--muted);
    }

    /* CARDS GRID */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1rem;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1rem 2rem;
    }
    .person-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: opacity 0.2s, border-color 0.2s;
    }
    .person-card.dimmed {
      opacity: 0.55;
    }
    .person-card.active-user {
      border-color: var(--coral);
    }
    .card-header {
      padding: 0.85rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-header-left { display: flex; align-items: center; gap: 0.6rem; }
    .card-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      font-weight: 700;
    }
    .card-name {
      font-weight: 700;
      font-size: 1rem;
    }
    .card-streak {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.1rem;
    }
    .rest-btn {
      font-size: 0.72rem;
      padding: 0.3rem 0.65rem;
      border-radius: 20px;
      border: 1.5px solid;
      cursor: pointer;
      font-weight: 600;
      background: transparent;
      transition: background 0.15s, color 0.15s;
    }
    .rest-btn.used {
      opacity: 0.7;
      cursor: default;
    }
    .tasks-list {
      padding: 0.5rem 1rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .task-row {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.55rem 0.75rem;
      border-radius: 10px;
      background: var(--surface2);
      cursor: pointer;
      transition: background 0.15s;
      user-select: none;
    }
    .task-row:hover:not(.task-locked) { filter: brightness(1.12); }
    .task-row.task-locked { cursor: default; }
    .task-check {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 0.85rem;
      transition: background 0.15s, border-color 0.15s;
    }
    .task-check.checked {
      background: #22c55e;
      border-color: #22c55e;
    }
    .task-label {
      font-size: 0.88rem;
      color: var(--text);
      flex: 1;
    }
    .task-icon { font-size: 1rem; }

    /* LOCKED OVERLAY TEXT */
    .locked-msg {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 1rem 0;
      font-style: italic;
    }

    /* USER PICKER MODAL */
    #userModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    #userModal.show { display: flex; }
    .user-modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem 1.5rem;
      max-width: 420px;
      width: 90%;
      text-align: center;
    }
    .user-modal-box h2 {
      font-size: 1.3rem;
      color: var(--coral);
      margin-bottom: 0.4rem;
    }
    .user-modal-box p {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
    }
    .user-picker-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .user-pick-btn {
      background: var(--surface2);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 1rem 0.75rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }
    .user-pick-btn:hover { border-color: var(--coral); }
    .user-pick-emoji { font-size: 1.8rem; }
    .user-pick-name {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--text);
    }

    /* SWITCH BUTTON */
    #switchBtn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      padding: 0.3rem 0.65rem;
      font-size: 0.78rem;
      cursor: pointer;
      margin-left: 0.25rem;
    }
    #switchBtn:hover { border-color: var(--coral); color: var(--coral); }

    /* STATS MODAL */
    #statsModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      align-items: flex-start;
      justify-content: center;
      overflow-y: auto;
      padding: 2rem 1rem;
    }
    #statsModal.show { display: flex; }
    .stats-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.5rem;
      width: 100%;
      max-width: 900px;
    }
    .stats-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .stats-header h2 {
      color: var(--coral);
      font-size: 1.2rem;
    }
    #closeStats {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      padding: 0.3rem 0.7rem;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 1rem;
    }
    .stats-person {
      text-align: center;
    }
    .stats-person-name {
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--text);
    }
    .stats-days-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 3px;
    }
    .stats-day-box {
      aspect-ratio: 1;
      border-radius: 3px;
      background: var(--surface2);
      border: 1px solid var(--border);
    }
    .stats-day-box.complete { background: #22c55e; border-color: #22c55e; }
    .stats-day-box.incomplete { background: #ef4444; border-color: #ef4444; }
    .stats-day-box.rest { background: #a855f7; border-color: #a855f7; }

    @media (max-width: 600px) {
      .cards-grid { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <span class="nav-brand">✨ Challenge V2</span>
  <div class="nav-right">
    <button id="statsBtn">Stats 📊</button>
    <button id="switchBtn">Switch 👤</button>
  </div>
</nav>

<!-- HERO -->
<div class="hero">
  <h1>🔥 Track · Commit · Conquer</h1>
  <p>60 Day Glow Up Challenge</p>
</div>

<!-- PROGRESS BAR -->
<div class="progress-wrap">
  <div class="progress-label">
    <span id="progressLabel">Day 0 / 60</span>
    <span id="daysLeft">60 days left</span>
  </div>
  <div class="progress-bar-outer">
    <div class="progress-bar-inner" id="progressBar" style="width:0%"></div>
  </div>
</div>

<!-- DAY NAV -->
<div class="day-nav">
  <button id="prevDay">‹</button>
  <div class="day-info">
    <div class="day-num" id="dayNum">Day 1</div>
    <div class="day-date" id="dayDate">—</div>
  </div>
  <button id="nextDay">›</button>
</div>

<!-- CARDS -->
<div class="cards-grid" id="cardsGrid"></div>

<!-- USER PICKER MODAL -->
<div id="userModal" class="show">
  <div class="user-modal-box">
    <h2>Who are you? 🌟</h2>
    <p>Pick your profile to get started</p>
    <div class="user-picker-grid" id="userPickerGrid"></div>
  </div>
</div>

<!-- STATS MODAL -->
<div id="statsModal">
  <div class="stats-box">
    <div class="stats-header">
      <h2>📊 60-Day Progress</h2>
      <button id="closeStats">Close ✕</button>
    </div>
    <div class="stats-grid" id="statsGrid"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

// ── CONFIG ──────────────────────────────────────────────────────────────────
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDaFuMuHJAB7oT7YEiHaqw4g26w_iqJr_E",
  authDomain: "mbrpworkoutchallenge.firebaseapp.com",
  projectId: "mbrpworkoutchallenge",
  storageBucket: "mbrpworkoutchallenge.appspot.com",
  messagingSenderId: "948531101247",
  appId: "1:948531101247:web:0cd3e2c8f2dcbdf5fc0bb8"
};
const COLLECTION = 'challenge_v2';
const ANALYTICS_COLLECTION = 'analytics_v2';
const USER_KEY = 'challenge_v2_user';
const TOTAL_DAYS = 60;
const START_DATE = new Date('2026-09-21T00:00:00');

const PEOPLE = [
  { id: 'benju',     name: 'Benju',     emoji: '💪', color: '#e84040' },
  { id: 'meegan',   name: 'Meegan',    emoji: '🌸', color: '#ff9ec8' },
  { id: 'sherile',  name: 'Sherile',   emoji: '💅', color: '#c084fc' },
  { id: 'zachy',    name: 'Zachy',     emoji: '⚡', color: '#22d3ee' },
  { id: 'sharayray',name: 'Sharayray', emoji: '🌺', color: '#fb923c' },
  { id: 'tuf',      name: 'Tuf',       emoji: '🦁', color: '#84cc16' },
];

const TASKS = [
  { id: 'water',      label: '10 Cups of Water',    icon: '💧' },
  { id: 'steps',      label: '8k Steps',             icon: '👟' },
  { id: 'vitamins',   label: 'Vitamins',             icon: '💊' },
  { id: 'nodrink',    label: 'No Drinking',          icon: '🚫🍷' },
  { id: 'nodelivery', label: 'No Delivery',          icon: '🚫🛵' },
  { id: 'workout',    label: 'Active Workout',       icon: '🏋️' },
  { id: 'skincare',   label: 'Skincare Routine',     icon: '🧴' },
];
const REST_TASKS = { steps: '4k Steps', workout: 'Light Workout / Stretching' };

// ── INIT ────────────────────────────────────────────────────────────────────
const app = initializeApp(FIREBASE_CONFIG);
const db  = getFirestore(app);

let currentUser = localStorage.getItem(USER_KEY) || null;
let dayOffset   = 0;  // 0 = today
let state       = {}; // { 'benju_2': { water: true, ... }, ... }

// ── DATE HELPERS ────────────────────────────────────────────────────────────
function todayOffset() {
  const now = new Date();
  const ms  = now.setHours(0,0,0,0) - START_DATE.getTime();
  return Math.floor(ms / 86400000);
}
function dateForOffset(off) {
  const d = new Date(START_DATE);
  d.setDate(d.getDate() + off);
  return d;
}
function docKey(personId, off) {
  return `${personId}_${off}`;
}
function isLocked(off) {
  return off > todayOffset();
}

// ── REST DAY LOGIC ──────────────────────────────────────────────────────────
function hasUsedRestDay(personId, off) {
  for (let i = off; i >= Math.max(0, off - 6); i--) {
    const k = docKey(personId, i);
    if (state[k] && state[k].restDay) return true;
  }
  return false;
}

// ── FIRESTORE ───────────────────────────────────────────────────────────────
async function saveTask(personId, off, taskId, value) {
  const key = docKey(personId, off);
  const ref = doc(db, COLLECTION, key);
  const snap = await getDoc(ref);
  const data = snap.exists() ? snap.data() : {};
  data[taskId] = value;
  await setDoc(ref, data, { merge: true });

  // Analytics
  if (value === true) {
    try {
      const ts = new Date().toISOString();
      const aRef = doc(db, ANALYTICS_COLLECTION, `${key}_${taskId}_${ts}`);
      await setDoc(aRef, { person: personId, day: off, task: taskId, completedAt: ts });
    } catch(e) { /* ignore analytics errors */ }
  }
}

async function saveRestDay(personId, off, value) {
  const key = docKey(personId, off);
  const ref = doc(db, COLLECTION, key);
  await setDoc(ref, { restDay: value }, { merge: true });
}

// ── SNAPSHOT LISTENER ───────────────────────────────────────────────────────
function listenToDay(off) {
  const keys = PEOPLE.map(p => docKey(p.id, off));
  keys.forEach(key => {
    const ref = doc(db, COLLECTION, key);
    onSnapshot(ref, snap => {
      state[key] = snap.exists() ? snap.data() : {};
      renderCards();
    });
  });
}

// ── RENDER ──────────────────────────────────────────────────────────────────
function renderProgress() {
  const today = Math.min(todayOffset() + 1, TOTAL_DAYS);
  const pct = Math.min((today / TOTAL_DAYS) * 100, 100);
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `Day ${Math.max(today,1)} / ${TOTAL_DAYS}`;
  const left = Math.max(TOTAL_DAYS - todayOffset(), 0);
  document.getElementById('daysLeft').textContent = `${left} day${left !== 1 ? 's' : ''} left`;
}

function renderDayNav() {
  const off = dayOffset;
  const today = todayOffset();
  const d = dateForOffset(off);
  const dayNum = off + 1;

  document.getElementById('dayNum').textContent = `Day ${dayNum}`;
  const opts = { weekday: 'short', month: 'short', day: 'numeric' };
  let label = d.toLocaleDateString(undefined, opts);
  if (off === today) label += ' · Today';
  document.getElementById('dayDate').textContent = label;

  document.getElementById('prevDay').disabled = off <= 0;
  document.getElementById('nextDay').disabled = off >= TOTAL_DAYS - 1;
}

function renderCards() {
  renderDayNav();
  const grid = document.getElementById('cardsGrid');
  const off  = dayOffset;
  const locked = isLocked(off);

  // Sort: current user first
  const sorted = currentUser
    ? [...PEOPLE].sort((a, b) => (a.id === currentUser ? -1 : b.id === currentUser ? 1 : 0))
    : PEOPLE;

  grid.innerHTML = '';

  sorted.forEach(person => {
    const key     = docKey(person.id, off);
    const data    = state[key] || {};
    const isMe    = person.id === currentUser;
    const isRest  = !!data.restDay;
    const canRest = isMe && !locked && !hasUsedRestDay(person.id, off);

    // Streak
    let streak = 0;
    for (let i = off - 1; i >= 0; i--) {
      const d2 = state[docKey(person.id, i)] || {};
      const allDone = d2.restDay || TASKS.every(t => d2[t.id]);
      if (allDone) streak++;
      else break;
    }

    // Card
    const card = document.createElement('div');
    card.className = 'person-card' + (!isMe && currentUser ? ' dimmed' : '') + (isMe ? ' active-user' : '');
    card.style.borderColor = isMe ? person.color : '';

    // Header
    const header = document.createElement('div');
    header.className = 'card-header';

    const headerLeft = document.createElement('div');
    headerLeft.className = 'card-header-left';

    const avatar = document.createElement('div');
    avatar.className = 'card-avatar';
    avatar.style.background = person.color + '33';
    avatar.style.color = person.color;
    avatar.textContent = person.emoji;

    const nameWrap = document.createElement('div');
    const nameEl = document.createElement('div');
    nameEl.className = 'card-name';
    nameEl.style.color = person.color;
    nameEl.textContent = person.name;

    const streakEl = document.createElement('div');
    streakEl.className = 'card-streak';
    streakEl.textContent = streak > 0 ? `🔥 ${streak} day streak` : 'No streak yet';

    nameWrap.appendChild(nameEl);
    nameWrap.appendChild(streakEl);
    headerLeft.appendChild(avatar);
    headerLeft.appendChild(nameWrap);

    const restBtn = document.createElement('button');
    restBtn.className = 'rest-btn' + (isRest ? ' used' : '');
    restBtn.style.borderColor = person.color;
    restBtn.style.color = person.color;
    restBtn.textContent = isRest ? '🌙 Rest Day' : '🌙 Rest';
    if (!canRest && !isRest) {
      restBtn.disabled = true;
      restBtn.style.opacity = '0.35';
      restBtn.style.cursor = 'default';
    }
    if (isMe && !locked && !isRest && canRest) {
      restBtn.dataset.action = 'rest';
      restBtn.dataset.person = person.id;
      restBtn.dataset.off    = off;
    }

    header.appendChild(headerLeft);
    header.appendChild(restBtn);
    card.appendChild(header);

    // Tasks
    const tasksList = document.createElement('div');
    tasksList.className = 'tasks-list';

    if (isRest) {
      const msg = document.createElement('div');
      msg.className = 'locked-msg';
      msg.textContent = '🌙 Rest day — great job taking care of yourself!';
      tasksList.appendChild(msg);
    } else {
      TASKS.forEach(task => {
        const checked  = !!data[task.id];
        let   labelTxt = task.label;
        if (isRest) {
          if (task.id === 'steps')   labelTxt = REST_TASKS.steps;
          if (task.id === 'workout') labelTxt = REST_TASKS.workout;
        }

        const row = document.createElement('div');
        row.className = 'task-row' + (locked ? ' task-locked' : '');
        if (isMe && !locked) {
          row.dataset.action = 'task';
          row.dataset.person = person.id;
          row.dataset.off    = off;
          row.dataset.task   = task.id;
          row.dataset.value  = checked ? 'true' : 'false';
        }

        const checkBox = document.createElement('div');
        checkBox.className = 'task-check' + (checked ? ' checked' : '');
        checkBox.style.borderColor = checked ? '' : person.color + '66';
        if (checked) checkBox.textContent = '✓';

        const iconEl = document.createElement('span');
        iconEl.className = 'task-icon';
        iconEl.textContent = task.icon;

        const labelEl = document.createElement('span');
        labelEl.className = 'task-label';
        labelEl.textContent = labelTxt;
        if (checked) labelEl.style.textDecoration = 'line-through';
        if (checked) labelEl.style.opacity = '0.6';

        row.appendChild(checkBox);
        row.appendChild(iconEl);
        row.appendChild(labelEl);
        tasksList.appendChild(row);
      });
    }

    if (locked) {
      tasksList.innerHTML = '';
      const msg = document.createElement('div');
      msg.className = 'locked-msg';
      msg.textContent = '🔒 Future day — come back later!';
      tasksList.appendChild(msg);
    }

    card.appendChild(tasksList);
    grid.appendChild(card);
  });
}

function renderStats() {
  const grid = document.getElementById('statsGrid');
  grid.innerHTML = '';
  PEOPLE.forEach(person => {
    const wrap = document.createElement('div');
    wrap.className = 'stats-person';

    const nameEl = document.createElement('div');
    nameEl.className = 'stats-person-name';
    nameEl.style.color = person.color;
    nameEl.textContent = `${person.emoji} ${person.name}`;
    wrap.appendChild(nameEl);

    const daysGrid = document.createElement('div');
    daysGrid.className = 'stats-days-grid';

    for (let i = 0; i < TOTAL_DAYS; i++) {
      const box = document.createElement('div');
      box.className = 'stats-day-box';
      const d = state[docKey(person.id, i)] || {};
      if (d.restDay) {
        box.classList.add('rest');
      } else if (i <= todayOffset()) {
        const done = TASKS.every(t => d[t.id]);
        box.classList.add(done ? 'complete' : 'incomplete');
      }
      box.title = `Day ${i + 1}`;
      daysGrid.appendChild(box);
    }
    wrap.appendChild(daysGrid);
    grid.appendChild(wrap);
  });
}

// ── USER PICKER ──────────────────────────────────────────────────────────────
function buildUserPicker() {
  const grid = document.getElementById('userPickerGrid');
  grid.innerHTML = '';
  PEOPLE.forEach(person => {
    const btn = document.createElement('button');
    btn.className = 'user-pick-btn';
    btn.dataset.action = 'pickUser';
    btn.dataset.person = person.id;
    btn.style.borderColor = person.color;

    const emoji = document.createElement('div');
    emoji.className = 'user-pick-emoji';
    emoji.textContent = person.emoji;

    const name = document.createElement('div');
    name.className = 'user-pick-name';
    name.style.color = person.color;
    name.textContent = person.name;

    btn.appendChild(emoji);
    btn.appendChild(name);
    grid.appendChild(btn);
  });
}

// ── LOAD ALL DAYS FOR STATS ──────────────────────────────────────────────────
async function loadAllDays() {
  const promises = [];
  for (let i = 0; i < TOTAL_DAYS; i++) {
    PEOPLE.forEach(person => {
      const key = docKey(person.id, i);
      const ref = doc(db, COLLECTION, key);
      promises.push(
        getDoc(ref).then(snap => {
          state[key] = snap.exists() ? snap.data() : {};
        })
      );
    });
  }
  await Promise.all(promises);
}

// ── BOOT ────────────────────────────────────────────────────────────────────
async function init() {
  buildUserPicker();
  dayOffset = Math.min(Math.max(todayOffset(), 0), TOTAL_DAYS - 1);
  renderProgress();

  if (currentUser) {
    document.getElementById('userModal').classList.remove('show');
    listenToDay(dayOffset);
  } else {
    document.getElementById('userModal').classList.add('show');
  }
}

// ── EVENT DELEGATION ─────────────────────────────────────────────────────────
document.addEventListener('click', async e => {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;

  if (action === 'pickUser') {
    currentUser = target.dataset.person;
    localStorage.setItem(USER_KEY, currentUser);
    document.getElementById('userModal').classList.remove('show');
    listenToDay(dayOffset);
    renderCards();
    return;
  }

  if (action === 'task') {
    if (!currentUser) return;
    const person = target.dataset.person;
    if (person !== currentUser) return;
    const off    = parseInt(target.dataset.off);
    const taskId = target.dataset.task;
    const newVal = target.dataset.value !== 'true';
    await saveTask(person, off, taskId, newVal);
    return;
  }

  if (action === 'rest') {
    if (!currentUser) return;
    const person = target.dataset.person;
    if (person !== currentUser) return;
    const off = parseInt(target.dataset.off);
    await saveRestDay(person, off, true);
    return;
  }
});

document.getElementById('prevDay').addEventListener('click', () => {
  if (dayOffset > 0) {
    dayOffset--;
    listenToDay(dayOffset);
    renderCards();
  }
});
document.getElementById('nextDay').addEventListener('click', () => {
  if (dayOffset < TOTAL_DAYS - 1) {
    dayOffset++;
    listenToDay(dayOffset);
    renderCards();
  }
});

document.getElementById('switchBtn').addEventListener('click', () => {
  document.getElementById('userModal').classList.add('show');
});

document.getElementById('statsBtn').addEventListener('click', async () => {
  await loadAllDays();
  renderStats();
  document.getElementById('statsModal').classList.add('show');
});
document.getElementById('closeStats').addEventListener('click', () => {
  document.getElementById('statsModal').classList.remove('show');
});

init();
</script>
</body>
